name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Python version comes from .python-version; dev dependencies are included by default.
      - name: Install dependencies
        run: uv sync --locked

      # No data/, no .env, no secrets: tests that need the database or Gemini settings are skipped.
      - name: Run tests
        run: uv run pytest -q -rs
